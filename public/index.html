<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    <noscript>
      <link rel="stylesheet" href="/noscript-styles.css">
    </noscript>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <link rel="mask-icon" href="%PUBLIC_URL%/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Loading Patterns Tool</title>
  </head>
  <body>
    <noscript>
      <div class="app">
        <div class="heading">
          <div class="logo"></div>
          <h2 class="title">React Loading Patterns</h2>
        </div>
        <div class="upper-section">
          <div class="right-side">
            <div class="loading-pattern-option-list">
              <h3 class="category-title">
                <strong>Category</strong>
              </h3>
              <select class="mobile">
                <option value="static-import">Static Import</option>
              </select>
              <div class="desktop">
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="static-import"
                    checked>
                  <span>&nbsp;Static Import</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="dynamic-import">
                  <span>&nbsp;Dynamic Import</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="route-based-code-splitting">
                  <span>&nbsp;Route-based code-splitting</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="route-based-code-splitting-with-skeleton-ui">
                  <span>&nbsp;Route-based code-splitting w/Skeleton UI</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="dynamic-import-with-error-boundary">
                  <span>&nbsp;Dynamic Import w/Error Boundary</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="import-on-interaction">
                  <span>&nbsp;Import on interaction</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="loadable-components">
                  <span>&nbsp;Loadable Components</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="loadable-components-ssr">
                  <span>&nbsp;Loadable Components (SSR)</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="streaming-rendering">
                  <span>&nbsp;Streaming Rendering</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="progressive-hydration">
                  <span>&nbsp;Progressive Hydration</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="import-on-visibility">
                  <span>&nbsp;Import on visibility</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="prefetch">
                  <span>&nbsp;Prefetch</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="preload">
                  <span>&nbsp;Preload</span>
                </div>
              </div>
            </div>
            <div class="skeleton-ui-checkbox">
              <input
                type='checkbox'
                name='skeleton-ui'>
              <label htmlFor='skeleton-ui'>Do you want to experience Skeleton UI?</label>
            </div>
          </div>
          <div class="left-side">
            <div class="code-snippet-area">
              <pre style="margin: 8px 0;">You need to enable JavaScript to run this app.</pre>
            </div>
            <div class="content messenger messenger--height">
            </div>
          </div>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
