<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    <noscript>
      <style type="text/css">
        body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
            'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
            sans-serif;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        code {
          font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
            monospace;
        }

        * {
          box-sizing: border-box;
        }
        *::before,
        *::after {
          box-sizing: inherit;
        }

        /* ------------------------------------- app start ------------------------------------- */
        .app {
          display: flex;
          flex-direction: column;
          padding: 24px;
          color: white;
          background-color: #282c34;
          min-height: 100vh;
          font-size: 16px;
        }

        @media only screen and (max-width: 600px) {
          .app {
            padding: 16px 12px 12px 12px;
          }
        }
        /* ------------------------------------- app end ------------------------------------- */

        /* ------------------------------------- heading start ------------------------------------- */
        .heading {
          display: flex;
          align-items: center;
        }

        .logo {
          background-image: url('/assets/images/logo.svg');
          background-color: transparent;
          width: 40px;
          height: 40px;
          background-position: center;
          background-repeat: no-repeat;
          background-size: cover;
        }

        .title {
          height: 32px;
          margin: 20px 8px;
          display: flex;
          align-items: center;
        }

        @media only screen and (max-width: 600px) {
          .title {
            margin: 0 8px;
            font-size: 20px;
          }
          .logo {
            width: 32px;
            height: 32px;
          }
        }
        /* ------------------------------------- heading end ------------------------------------- */

        /* ------------------------------------- upper section start ------------------------------------- */
        .upper-section {
          display: flex;
          flex-direction: column;
          margin-bottom: 16px;
        }

        .left-side {
          flex-grow: 1;
        }

        .right-side {
          height: 84px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          font-size: 14px;
        }

        @media only screen and (min-width: 1200px) {
          .upper-section {
            flex-direction: row-reverse;
          }

          .right-side {
            height: unset;
            align-items: center;
            justify-content: flex-start;
            font-size: inherit;
          } 
        }

        .loading-pattern-option-list {
          display: flex;
          align-items: center;
          padding: 8px 20px;
        }

        .category-title {
          margin: 0;
          margin-right: 8px;
        }

        .desktop {
          display: none;
        }

        @media only screen and (min-width: 1200px) {
          .loading-pattern-option-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
          }

          .mobile {
            display: none;
          }

          .desktop {
            display: block;
            min-width: 360px;
          }
        }

        .loading-loading-pattern-option-list-item {
          display: flex;
          align-items: center;
          margin: 16px 0;
        }

        input[type='radio'] {
          width: 16px;
          height: 16px;
          cursor: pointer;
          margin-left: 8px;
          margin-right: 8px;
        }

        .skeleton-ui-checkbox {
          padding: 8px 20px;
          display: flex;
          align-items: center;
        }

        input[type='checkbox'] {
          width: 16px;
          height: 16px;
          cursor: pointer;
          margin: 0;
          margin-right: 8px;
        }

        .code-snippet-area {
          font-size: 16px;
        }

        .code-snippet-area > pre {
          height: calc(100vh - 24px - 32px - 40px - 16px - 400px + 4px);
        }

        @media only screen and (max-width: 1200px) {
          .code-snippet-area > pre {
            height: calc(100vh - 24px - 32px - 40px - 84px - 16px - 400px + 4px);
          }
        }

        @media only screen and (max-width: 600px) {
          .code-snippet-area {
            font-size: 8px;
          }

          .code-snippet-area > pre {
            height: calc(100vh - 16px - 32px - 84px - 8px - 400px + 4px);
          }
        }

        .content {
          color: #000;
          pointer-events: none;
        }

        .messenger {
          position: relative;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
          background: white;
        }

        .messenger--height {
          height: 400px;
        }
        /* ------------------------------------- upper section end ------------------------------------- */
      </style>
    </noscript>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <link rel="mask-icon" href="%PUBLIC_URL%/safari-pinned-tab.svg" color="#5bbad5">
    <style type="text/css">

    <link
      rel="preload"
      href="%PUBLIC_URL%/assets/styles/github-markdown-non-critical.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'">

    <meta name="theme-color" content="#ffffff">
    <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

    <title>Loading Patterns Tool</title>
  </head>
  <body>
    <noscript>
      <div class="app">
        <div class="heading">
          <div class="logo"></div>
          <h2 class="title">React Loading Patterns</h2>
        </div>
        <div class="upper-section">
          <div class="right-side">
            <div class="loading-pattern-option-list">
              <h3 class="category-title">
                <strong>Category</strong>
              </h3>
              <select class="mobile">
                <option value="static-import">Static Import</option>
              </select>
              <div class="desktop">
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="static-import"
                    checked>
                  <span>&nbsp;Static Import</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="dynamic-import">
                  <span>&nbsp;Dynamic Import</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="route-based-code-splitting">
                  <span>&nbsp;Route-based code-splitting</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="route-based-code-splitting-with-skeleton-ui">
                  <span>&nbsp;Route-based code-splitting w/Skeleton UI</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="dynamic-import-with-error-boundary">
                  <span>&nbsp;Dynamic Import w/Error Boundary</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="import-on-interaction">
                  <span>&nbsp;Import on interaction</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="loadable-components">
                  <span>&nbsp;Loadable Components</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="loadable-components-ssr">
                  <span>&nbsp;Loadable Components (SSR)</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="streaming-rendering">
                  <span>&nbsp;Streaming Rendering</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="progressive-hydration">
                  <span>&nbsp;Progressive Hydration</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="import-on-visibility">
                  <span>&nbsp;Import on visibility</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="prefetch">
                  <span>&nbsp;Prefetch</span>
                </div>
                <div class="loading-loading-pattern-option-list-item">
                  <input
                    type="radio"
                    name="react-loading-patterns"
                    value="preload">
                  <span>&nbsp;Preload</span>
                </div>
              </div>
            </div>
            <div class="skeleton-ui-checkbox">
              <input
                type='checkbox'
                name='skeleton-ui'>
              <label htmlFor='skeleton-ui'>Do you want to experience Skeleton UI?</label>
            </div>
          </div>
          <div class="left-side">
            <div class="code-snippet-area">
              <pre style="margin: 8px 0;">You need to enable JavaScript to run this app.</pre>
            </div>
            <div class="content messenger messenger--height">
            </div>
          </div>
        </div>
      </div>
    </noscript>
    <div id="root"></div>

  </body>
